server {
    listen 80;

    # Resolver DNS interno de Docker. Con valid=5s Nginx vuelve a consultar
    # los registros de backend_api, así detecta las réplicas nuevas al escalar
    # (--scale) sin necesidad de reiniciar el frontend.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Proxy hacia el servicio interno backend_api en la red de Docker
    location /api/ {
        # Usar una variable fuerza la resolución DNS en cada petición
        set $backend http://backend_api:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
